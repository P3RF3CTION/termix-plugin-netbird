# Keeps the SHA-pinned actions and the npm dependencies current. A cooldown
# of a week lets a hijacked release get caught upstream before it lands here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # A new SDK major brings a new plugin API and Termix minimum; update it
      # by hand together with engine in manifest.json.
      - dependency-name: "@termix-ssh/plugin-sdk"
        update-types: ["version-update:semver-major"]
