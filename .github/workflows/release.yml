name: Release

# Run by hand from a dev-X.Y.Z branch. stable releases X.Y.Z and merges the
# branch into main; beta publishes X.Y.Z-beta.N for plugins on the beta
# channel. overwrite releases the manifest version again from this commit.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Stable release or beta"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      mode:
        description: "release, overwrite (stable only) or dry-run"
        required: true
        default: release
        type: choice
        options:
          - release
          - overwrite
          - dry-run

# Nothing at the workflow level; every job asks for what it needs.
permissions: {}

# One release at a time: sign and registry look the release up by version,
# and two runs at once would race on the tag and on the push to main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      # Build provenance, so the community registry can check where the file
      # was built.
      id-token: write
      attestations: write
    uses: Termix-SSH/Termix-Registry/.github/workflows/plugin-release.yml@main
    with:
      channel: ${{ inputs.channel }}
      mode: ${{ inputs.mode }}
    # No secrets on purpose: "secrets: inherit" does not reach a workflow of
    # another organisation anyway, and the private key must not go to code on
    # @main of a foreign repo. Signing runs in the job "sign" below.

  # Signs the file the release job attached, with this repo's own key and the
  # SDK version from package-lock.json, and attaches the .sig.
  sign:
    needs: release
    if: ${{ inputs.mode != 'dry-run' }}
    runs-on: ubuntu-latest
    permissions:
      # gh release upload
      contents: write
    steps:
      # The version to sign comes from manifest.json at this ref. A stable
      # release merges the dev branch into main and deletes it, so read main;
      # a beta or an overwrite leaves main alone, so read the commit it ran on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (inputs.channel == 'stable' && inputs.mode == 'release') && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the SDK
        env:
          HUSKY: "0"
        run: npm ci --ignore-scripts
      - name: Sign the release file
        env:
          GH_TOKEN: ${{ github.token }}
          TERMIX_PLUGIN_SIGNING_KEY: ${{ secrets.TERMIX_PLUGIN_SIGNING_KEY }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -z "$TERMIX_PLUGIN_SIGNING_KEY" ]; then
            echo "::error::TERMIX_PLUGIN_SIGNING_KEY is not set"
            exit 1
          fi
          # The release of this run's version, not whichever release is newest:
          # X.Y.Z for stable, the newest X.Y.Z-beta.N for beta (with or
          # without a leading v).
          VERSION=$(node -p 'require("./manifest.json").version')
          export VERSION
          if [ "$CHANNEL" = "beta" ]; then
            filter='[.[] | select(.isPrerelease and ((.tagName | ltrimstr("v")) | startswith(env.VERSION + "-beta.")))] | sort_by(.createdAt) | last | .tagName // empty'
          else
            filter='[.[] | select((.tagName | ltrimstr("v")) == env.VERSION)] | first | .tagName // empty'
          fi
          tag=$(gh release list --limit 100 --json tagName,isPrerelease,createdAt -q "$filter")
          if [ -z "$tag" ]; then
            echo "::error::no $CHANNEL release found for version $VERSION"
            exit 1
          fi
          echo "signing release $tag"
          mkdir -p signed
          gh release download "$tag" --pattern '*.tmxplug' --dir signed --clobber
          npx termix-plugin sign signed/*.tmxplug
          npx termix-plugin verify signed/*.tmxplug --key "$(cat registry/public-key.txt)"
          gh release upload "$tag" signed/*.tmxplug.sig --clobber

  # Rebuilds registry/index.json, the index Termix reads when this repo is
  # added as a plugin registry, from the signed release files.
  registry:
    needs: sign
    if: ${{ inputs.mode != 'dry-run' }}
    runs-on: ubuntu-latest
    permissions:
      # git push of registry/index.json
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Write the registry index
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/registry-index.mjs
      # The token goes to this one step only, not into the git config.
      - name: Commit the index
        env:
          HUSKY: "0"
          GH_TOKEN: ${{ github.token }}
        run: |
          git add registry/index.json
          if git diff --cached --quiet; then
            echo "index unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update the plugin registry index"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
